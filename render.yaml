services:
  - name: dims-backend
    type: web
    runtime: node
    plan: free
    # Matches the Neon database's region (AWS US East 2 / Ohio). Left at
    # Render's default (Oregon) originally — every query was paying a
    # cross-country round trip, measured at ~2s for a single simple
    # indexed query alone.
    region: ohio
    # --include=dev is required: NODE_ENV=production is set below, and
    # npm skips devDependencies by default whenever that's set — but
    # typescript, @types/*, and the prisma CLI (needed to build and to
    # run migrate deploy at startup) all live there.
    buildCommand: npm install --include=dev && npm run build
    # preDeployCommand isn't available on the free plan, so migrations run
    # as part of startup instead — functionally the same outcome (schema
    # is current before the app accepts traffic), just on every boot
    # rather than only on deploy.
    startCommand: npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Not managed by Render — a Neon (or Supabase) Postgres connection
      # string. Render prompts for this once when the Blueprint is first
      # created; set/update it any other time from the service's
      # Environment tab. See https://neon.tech to create the database.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://dims-project.vercel.app
      # Demo/dev login bypass (any @gmail.com + shared password) is only
      # ever active when this is unset outside production anyway, but set
      # explicitly here so it's never accidentally on in prod.
      - key: DEV_AUTH_BYPASS
        value: "false"
      # Brevo SMTP relay — host/port/login/sender aren't secret on their
      # own (the SMTP key is what actually authenticates), but the key
      # itself is set directly in Render's Environment tab, never here.
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: a89938001@smtp-brevo.com
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "Direct Inventory Manager <abidodd4045@gmail.com>"
